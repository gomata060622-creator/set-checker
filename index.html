<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&display=swap">
<style>
/* 店の棚の前で片手で使う道具：上に検索の帯、下にセットの一覧と各巻の表。数字は等幅でそろえる */
:root {

  --hit: #fff4c2;             /* 読み取った巻 */
  --bought: #ebf1de;          /* スマホで記入した仕入れ（セットデータのA38から下と同じ薄い緑） */
  --bought-fg: #1d2530;

}
@media (prefers-color-scheme: dark) {

    --accent: #7ea7da; --accent-soft: #1f2d3f; --grey: #a7adb5; --miss: #3a2320; --miss-fg: #ff9a85;
    --hit: #3b3416; --good: #5fd39a; --bad: #ff7b6b; --bought: #2b3a1f; --bought-fg: #e6ebf1; color-scheme: dark;
  }
}
:root[data-theme="dark"] {

  --accent: #7ea7da; --accent-soft: #1f2d3f; --grey: #a7adb5; --miss: #3a2320; --miss-fg: #ff9a85;
  --hit: #3b3416; --good: #5fd39a; --bad: #ff7b6b; --bought: #2b3a1f; --bought-fg: #e6ebf1; color-scheme: dark;

  </div>
</div>

<main class="wrap" id="main"></main>
<div id="sheet" class="sheet" hidden></div>

<script>
(function () {
  "use strict";
  // 見本（データを読み込むまで表示する）
  const SAMPLE = {"v":1,"made":"見本","sample":true,"sets":[{"s":"文庫新書単行本DVD児童書絵本","t":"つげ義春コレクション 全9冊セット (ちくま文庫)","a":"4480425403","cat":"文庫","p":6934,"n":9,"avg":464,"pr":-3414,"rk":23961,"memo":"260×380","col":"I","vol":[["ねじ式/夜が掴む","9784480425416",829,708],["大場電気鍍金工業所/やもり","9784480425423",658,537],["李さん一家/海辺の叙景","9784480425430",1000,777],["近所の景色/無能の人","9784480425447",1656,542],["紅い花/やなぎ屋主人","9784480425454",740,967],["苦節十年記/旅籠の思い出","9784480425461",1139,1080],["四つの犯罪/七つの墓場","9784480425478",589,955],["腹話術師/ねずみ","9784480425485",930,1002],["鬼面石/一刀両断","9784480425492",1051,1067]],"own":[{"a":"","c":"K","p":6934,"n":9,"f7":470,"f9":1284,"dc":-487,"x":[340,523,484,432,484,755,572,572,709]},{"a":"4480425403","c":"M","x":[null,null,null,null,null,null,null,null,null]},{"a":"4480425403","c":"N","x":[null,null,null,null,null,null,null,null,null]}],"sold":[{"d":"2026/02/17","p":7980,"x":[267,387,605,605,605,770,715,715,770]}]},{"s":"文庫新書単行本DVD児童書絵本","t":"新潮文庫 十二国記セット","a":"B00DCQ0GCG","cat":"文庫","p":8632,"n":15,"avg":375,"pr":-5159,"rk":652446,"memo":"260×380","col":"EY","vol":[["","9784101240510",1069,484],["","9784101240527",626,269],["","9784101240534",709,302],["","9784101240541",816,300],["","9784101240558",736,415],["","9784101240565",843,463],["","9784101240572",961,400],["","9784101240589",646,240],["","9784101240596",807,599],["","9784101240602",920,657],["","9784101240619",892,680],["","9784101240626",675,220],["","9784101240633",550,150],["","9784101240640",667,238],["","9784101240657",880,359]],"own":[{"a":"","c":"FA","x":[176,176,176,150,278,176,176,176,450,492,470,220,176,176,176]},{"a":"B081CPKQSJ","c":"FI","x":[480,176,285,300,298,273,298,176,176,640,480,176,176,176,242]},{"a":"","c":"FJ","x":[298,88,176,176,364,176,350,220,220,176,550,176,176,176,242]},{"a":"","c":"FK","x":[280,176,260,220,298,380,410,176,430,500,610,176,176,176,242]},{"a":"B081CPKQSJ","c":"FR","x":[550,330,194,396,550,550,550,194,550,470,470,194,194,341,396]},{"a":"B081CPKQSJ","c":"FS","p":8632,"n":15,"f7":430,"f9":1564,"dc":null,"x":[null,null,194,null,null,null,null,194,null,null,null,194,null,null,null]},{"a":"B081CPKQSJ","c":"FT","x":[null,null,null,null,null,null,null,null,null,null,null,null,null,null,null]}],"sold":[{"d":"2026/09/02","p":9142,"x":[375,349,194,220,560,498,540,220,579,326,194,106,194,194,194]},{"d":"2026/08/12","p":9142,"x":[440,220,330,220,550,550,560,220,550,470,470,220,275,470,550]},{"d":"2026/07/22","p":6076,"x":[220,110,220,220,361,584,220,220,470,220,220,220,220,399,295]}]}]};

  const $ = (id) => document.getElementById(id);
  const main = $("main"), q = $("q"), info = $("dataInfo");
  let DATA = null, codeIdx = null, textIdx = null, lastList = null, showFull = false, setIdx = null;
  let curView = { type: "home" };
  try { showFull = localStorage.getItem("sc_full") === "1"; } catch (e) {}

  // ---------- 文字のそろえ方 ----------
  const kata = (s) => s.replace(/[ぁ-ゖ]/g, (c) => String.fromCharCode(c.charCodeAt(0) + 0x60));
  const norm = (s) => kata(String(s || "").normalize("NFKC").toLowerCase()).replace(/[\s・･\-‐―ー〜~_.,，、。()（）［］\[\]「」『』【】!！?？:：\/]/g, "");
  const esc = (s) => String(s == null ? "" : s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const yen = (n) => (n == null || isNaN(n) ? "" : Math.round(n).toLocaleString("ja-JP"));
  function isbn10to13(a) {
    const core = "978" + a.slice(0, 9);
    let s = 0;
    for (let i = 0; i < 12; i++) s += +core[i] * (i % 2 ? 3 : 1);
    return core + ((10 - (s % 10)) % 10);
  }

  // ---------- 索引 ----------
  function buildIndex(data) {
    codeIdx = new Map();
    textIdx = [];
    setIdx = new Map();
    data.sets.forEach((s, si) => {
      setIdx.set(s.s + "|" + s.col, si);
      const add = (k, vi) => {
        if (!k) return;
        if (!codeIdx.has(k)) codeIdx.set(k, []);
        codeIdx.get(k).push([si, vi]);
      };
      add(String(s.a || "").toUpperCase(), -1);
      // 集めている列の2行目のASIN（グレーの列と違うASINのこともある）でも探せるように
      (s.own || []).forEach((o) => { const a = String(o.a || "").toUpperCase(); if (a && a !== String(s.a || "").toUpperCase()) add(a, -1); });
      s.vol.forEach((v, vi) => { add(v[1], vi); });
      const au = auOf(s);
      textIdx.push({ si, t: norm(s.t) + (au ? "|" + norm(au.p) + "|" + norm(au.a) : ""), v: s.vol.map((v) => norm(v[0])) });
    });
  }

  // ---------- 保存（このスマホの中） ----------
  function idb() {
    return new Promise((res, rej) => {
      try {
        const r = indexedDB.open("setcheck", 1);
        r.onupgradeneeded = () => r.result.createObjectStore("data");
        r.onsuccess = () => res(r.result);
        r.onerror = () => rej(r.error);
      } catch (e) { rej(e); }
    });
  }
  async function saveData(obj) {
    try {
      const db = await idb();
      await new Promise((res, rej) => { const tx = db.transaction("data", "readwrite"); tx.objectStore("data").put(obj, "main"); tx.oncomplete = res; tx.onerror = () => rej(tx.error); });
      return true;
    } catch (e) { return false; }
  }
  async function loadData() {
    try {
      const db = await idb();
      return await new Promise((res) => { const tx = db.transaction("data", "readonly"); const g = tx.objectStore("data").get("main"); g.onsuccess = () => res(g.result || null); g.onerror = () => res(null); });
    } catch (e) { return null; }
  }

  // データが7日以上前なら知らせる（書き出しを忘れると、もう買った巻が「なし」のまま出るため）
  function oldNote(made) {
    const m = String(made || "").match(/(\d{4})\/(\d{1,2})\/(\d{1,2})/);
    if (!m) return "";
    const days = Math.floor((Date.now() - new Date(+m[1], +m[2] - 1, +m[3]).getTime()) / 86400000);
    return days >= 7 ? '　<span class="sample">' + days + "日前のデータです。セットデータで書き出し直してください</span>" : "";
  }

  // その巻を、そろっていない列ごとに持っているか（Excelの値か、スマホの記入があれば持っている）
  function volStatus(s, vi) {
    return ownStats(s).filter((x) => !x.full && vi < x.n).map((x) => {
      const o = s.own[x.i], v = o.x[vi];
      const have = (v != null && v !== "") || !!entryAt(s, o, vi + 1);
      return { i: x.i, have };
    });
  }
  const volStatusText = (st) => st.map((x) => '<span class="' + (x.have ? "vs-have" : "vs-miss") + '">' + circled(x.i) + (x.have ? "持っている" : "なし") + "</span>").join("・");

  function useData(obj) {
    DATA = obj;
    buildIndex(obj);
    const nv = obj.sets.reduce((a, s) => a + s.vol.length, 0);
    info.innerHTML = obj.sample
      ? '<span class="sample">見本のデータです</span>　セットデータから書き出したファイルを読み込んでください'
      : "データ：" + esc(obj.made) + "　<span class=\"num\">" + obj.sets.length.toLocaleString() + "</span>セット・<span class=\"num\">" + nv.toLocaleString() + "</span>巻" + oldNote(obj.made);
  }

  // ---------- 探す ----------
  function search(raw) {
    const s = String(raw || "").trim();
    if (!s || !DATA) return showHome();
    const digits = s.normalize("NFKC").replace(/[^0-9Xx]/g, "").toUpperCase();
    let hits = [];
    let byCode = false;
    if (/^[0-9X]+$/.test(s.normalize("NFKC").replace(/[\s-]/g, "").toUpperCase()) && (digits.length === 13 || digits.length === 10)) {
      byCode = true;
      const keys = [digits];
      if (digits.length === 10 && /^\d{9}[\dX]$/.test(digits)) keys.push(isbn10to13(digits));
      keys.forEach((k) => (codeIdx.get(k) || []).forEach((h) => hits.push(h)));
    } else if (/^[0-9A-Z]{10}$/i.test(s)) {
      byCode = true;
      (codeIdx.get(s.toUpperCase()) || []).forEach((h) => hits.push(h));
    }
    if (!byCode) {
      const n = norm(s);
      if (!n) return showHome();
      textIdx.forEach((x) => {
        if (x.t.includes(n)) { hits.push([x.si, -1]); return; }
        const vi = x.v.findIndex((t) => t && t.includes(n));
        if (vi >= 0) hits.push([x.si, vi]);
      });
    }
    // 同じセットは1つに
    const seen = new Map();
    hits.forEach(([si, vi]) => { if (!seen.has(si) || (seen.get(si) < 0 && vi >= 0)) seen.set(si, vi); });
    const list = [...seen.entries()];
    lastList = { q: s, list, byCode };
    if (byCode && list.length === 1) return showSet(list[0][0], list[0][1], true);
    showList();
  }

  function ownStats(s) {
    return s.own.map((o, i) => {
      // その列の巻数（列ごとの5行目）。巻数が少ない列は、その巻までそろえば「そろっている」
      const n = Math.min(o.n > 0 ? o.n : s.vol.length, s.vol.length);
      const xs = o.x.slice(0, n);
      const have = xs.filter((v) => v != null && v !== "").length;
      return { i, have, n, full: have >= n, miss: xs.map((v, vi) => (v == null || v === "" ? vi + 1 : 0)).filter(Boolean) };
    });
  }

  // 集めている列ごとの計算（Excelの6行目と同じ式）
  //   途中：(販売価格 − 手数料2つ − 利益1,000円 − 今の合計) ÷ 残りの冊数 ＝ 残り1冊いくらまで
  //   そろった：今の合計 ÷ 巻数 ＝ 1冊の平均
  //   今の合計＝持っている巻の値段＋スマホで記入した値段（まだExcelに入っていないものも）＋割引の行
  function colCalc(s, oi) {
    const o = s.own[oi];
    const n = Math.min(o.n > 0 ? o.n : s.vol.length, s.vol.length);
    let have = 0, total = 0, kari = 0;
    const miss = [];
    for (let i = 0; i < n; i++) {
      const v = o.x[i];
      if (typeof v === "number") { have++; total += v; }
      else if (v != null && v !== "") { have++; }
      else {
        const e = entryAt(s, o, i + 1);
        if (e) { have++; total += netP(e); if (e.kari) kari++; } else miss.push(i + 1);
      }
    }
    if (typeof o.dc === "number") total += o.dc;
    const tot = total > 0 ? total : 0;
    if (!miss.length) return { done: true, have, n, miss, kari, avg: tot > 0 ? Math.floor(tot / n) : null };
    const ok = typeof o.p === "number" && typeof o.f7 === "number" && typeof o.f9 === "number";
    const rem = ok ? o.p - o.f7 - o.f9 - 1000 - tot : null;   // 残りの巻に使っていいお金
    return { done: false, have, n, miss, kari, rem, lim: ok ? Math.floor(rem / miss.length) : null };
  }

  function chipsHtml(s) {
    const st = ownStats(s);
    if (!st.length) return '<span class="chip">集めている列なし</span>';
    const full = st.filter((x) => x.full);
    const part = st.filter((x) => !x.full);
    let h = "";
    if (full.length) {
      const avgs = full.map((x) => { const c = colCalc(s, x.i); return c.avg != null ? circled(x.i) + yen(c.avg) : null; }).filter(Boolean);
      const sent = full.filter((x) => s.own[x.i].nd);
      const nd = sent.length ? '　<span class="nd">納品済み ' + sent.length + "（" + sent.map((x) => esc(String(s.own[x.i].nd).replace(/^納品\s*/, ""))).join("・") + "）・手元 " + (full.length - sent.length) + "</span>" : "";
      h += '<span class="chip full num">そろっている ' + full.length + nd + (avgs.length ? '　<span class="avg">1冊平均 ' + avgs.join("・") + "円</span>" : "") + "</span>";
    }
    part.forEach((x) => {
      const c = colCalc(s, x.i);
      let tail = "";
      if (c.done) tail = '　記入でそろう' + (c.avg != null ? '　<span class="avg">1冊平均 ' + yen(c.avg) + "円</span>" : "");
      else {
        if (c.miss.length <= 6) tail += "　足りない " + c.miss.join("・");
        if (c.lim != null) tail += '　<span class="lim' + (c.lim < 0 ? " minus" : "") + '">1冊 ' + yen(c.lim) + "円まで</span>";
      }
      if (c.kari) tail += '　<span class="kchip2">仮の金額 ' + c.kari + "冊を含む</span>";
      h += '<span class="chip part num">' + circled(x.i) + " " + c.have + "/" + c.n + tail + "</span>";
    });
    return h;
  }
  const circled = (i) => (i < 20 ? String.fromCharCode(0x2460 + i) : "(" + (i + 1) + ")");

  function showList(intro) {
    curView = { type: "list", intro };
    const { q: s, list, byCode } = lastList;
    let h = intro || ('<div class="status">「' + esc(s) + "」" + (list.length ? "：" + list.length + "セット" : "：見つかりませんでした") + "</div>");
    if (!intro && byCode && list.length > 1) h += '<div class="multi">この本は <b>' + list.length + "つのセット</b>に入っています。どのセットで「なし」になっているか見て選んでください。</div>";
    if (!list.length) {
      h += '<div class="empty"><div>' + (byCode ? "このバーコードの本は、セットデータにありません。" : "この言葉が入ったセット・書名はありません。") + '</div><div class="note">書名の一部（例：「十二国記」）で探すこともできます。</div></div>';
    }
    h += '<div class="list">';
    list.slice(0, 80).forEach(([si, vi]) => {
      const st = DATA.sets[si];
      h += '<button class="item" data-si="' + si + '" data-vi="' + vi + '"><div class="t">' + esc(st.t || "（セット名なし）") + '</div>' +
        '<div class="sub num"><span>' + esc(st.cat || "") + "</span><span>" + esc(st.s) + " " + esc(st.col) + "列</span><span>" + st.vol.length + "巻</span>" +
        (st.p != null ? "<span>販売 " + yen(st.p) + "円</span>" : "") + "</div>" +
        (auLine(st) ? '<div class="au">' + auLine(st) + "</div>" : "") +
        (vi >= 0 ? '<div class="hitvol">' + (vi + 1) + "巻目：" + esc(st.vol[vi][0] || st.vol[vi][1]) + (function () { const vs = volStatus(st, vi); return vs.length ? "　" + volStatusText(vs) : "　そろっている"; })() + "</div>" : "") +
        '<div class="chips">' + (khOf(st) ? '<span class="chip kchip">小部屋 <b class="' + khGradeCls(khOf(st).g) + '">' + esc(khOf(st).g || "―") + "</b></span>" : "") + chipsHtml(st) + "</div></button>";
    });
    if (list.length > 80) h += '<div class="note">ほかに ' + (list.length - 80) + "セットあります。言葉を足して絞ってください。</div>";
    h += "</div>";
    main.innerHTML = h;
    main.querySelectorAll(".item").forEach((b) => b.addEventListener("click", () => showSet(+b.dataset.si, +b.dataset.vi, false)));
    window.scrollTo(0, 0);
    refocus();
  }


  function showSet(si, vi, fromScan, keepScroll) {
    curView = { type: "set", si, vi, fromScan };
    const scrollY = edPos ? edPos.y : window.scrollY;
    const s = DATA.sets[si];
    if (!keepScroll) recordView(s);
    const st = ownStats(s);
    const cols = st.filter((x) => !x.full);
    // 過去に買えた値段：売れた列（新しい順）のあとに、揃えた列（右から）。合わせて3列
    const past = s.sold.map((x) => ({ h: esc(x.d.slice(5)) + "<br>仕入", x: x.x }));
    st.filter((x) => x.full).slice().reverse().forEach((x) => past.push({ h: "揃え済<br>" + circled(x.i), x: s.own[x.i].x }));
    past.splice(3);
    // 目安：一番左のそろっていない列で、残りのお金を足りない巻に最新の値段の比で分ける
    //   （集めている列がない・販売価格などがない列は、今までどおり 平均仕入価格×巻数 を全部の巻に分ける）
    let aimOf = () => null, aimCol = null, estProfit = null, amzProfit = null;
    const baseC = cols.length ? colCalc(s, cols[0].i) : null;
    if (baseC && baseC.rem != null) {
      aimCol = cols[0].i;
      const missSet = new Set(baseC.miss);
      const msum = baseC.miss.reduce((a, vn) => { const lp = s.vol[vn - 1] && s.vol[vn - 1][2]; return a + (lp > 0 ? lp : 0); }, 0);
      aimOf = (i) => {
        if (!missSet.has(i + 1)) return null;
        const lp = s.vol[i][2];
        if (msum > 0 && lp > 0) return Math.round((baseC.rem * lp) / msum / 10) * 10;
        return baseC.lim;   // 最新の値段がない巻は、平均
      };
    } else {
      const gsum = s.vol.reduce((a, v) => a + (v[2] > 0 ? v[2] : 0), 0);
      const budget = s.avg != null && s.avg > 0 ? s.avg * s.vol.length : null;
      aimOf = (i) => { const v = s.vol[i]; return budget != null && gsum > 0 && v[2] > 0 ? Math.round((budget * v[2]) / gsum / 10) * 10 : null; };
    }
    const fact = (k, v, cls) => '<div class="fact"><span class="k">' + k + '</span><span class="v num ' + (cls || "") + '">' + v + "</span></div>";

    // ⑥をそろえたら：残りの巻を、過去に買った値段（売れた列とそろった列の、その巻の値段の平均）で買ったときの利益
    //   過去の値段がない巻は目安で計算する
    if (aimCol != null && baseC && baseC.rem != null) {
      const pastCols = s.sold.map((x) => x.x).concat(st.filter((x) => x.full).map((x) => s.own[x.i].x));
      let spend = 0, noPast = 0;
      baseC.miss.forEach((vn) => {
        const vals = pastCols.map((x) => x[vn - 1]).filter((v) => typeof v === "number" && v > 0);
        if (vals.length) spend += vals.reduce((a, b) => a + b, 0) / vals.length;
        else { noPast++; const a = aimOf(vn - 1); spend += a != null ? a : 0; }
      });
      estProfit = { v: Math.floor(baseC.rem + 1000 - spend), noPast };
      // 残りの巻を、Amazonの最新価格（グレーの列）で買ったときの利益。最新の値段がない巻は目安で計算する
      let spend2 = 0, noLatest = 0;
      baseC.miss.forEach((vn) => {
        const lp = s.vol[vn - 1] && s.vol[vn - 1][2];
        if (typeof lp === "number" && lp > 0) spend2 += lp;
        else { noLatest++; const a = aimOf(vn - 1); spend2 += a != null ? a : 0; }
      });
      amzProfit = { v: Math.floor(baseC.rem + 1000 - spend2), noLatest };
      // 計算に使った販売価格（その列の4行目。グレーの列とASINが違うと、上の販売価格と違うことがある）
      const bo = s.own[aimCol];
      const pTxt = typeof bo.p === "number" ? '<span class="k">（販売 ' + yen(bo.p) + "円" + (bo.a && String(bo.a).toUpperCase() !== String(s.a || "").toUpperCase() ? "・ASIN " + esc(bo.a) : "") + "）</span>" : "";
      estProfit.p = pTxt; amzProfit.p = pTxt;
    }
    let h = "";
    h += '<section class="head"><h1>' + esc(s.t || "（セット名なし）") + "</h1>";
    h += '<div class="note num">' + esc(s.cat || "") + "　" + esc(s.s) + " " + esc(s.col) + "列" + (s.a ? "　ASIN " + esc(s.a) : "") + "</div>";
    if (auLine(s)) h += '<div class="au big">' + auLine(s) + "</div>";
    // 読み取った巻の答え
    if (vi >= 0 && vi < s.vol.length) {
      const vs = volStatus(s, vi);
      let vh = '<div class="verdict num" id="verdict"><span>' + (vi + 1) + "巻：</span>";
      if (!vs.length) vh += '<span class="own">集めている列は全部そろっている</span>';
      else {
        const base = vs[0];
        if (!base.have) {
          const a = aimOf(vi);
          if (a == null) vh += '<span class="ok">' + circled(base.i) + "にない</span>";
          else if (a < 0) vh += '<span class="ng">' + circled(base.i) + "にない／もう利益1,000円は出ない（目安 " + yen(a) + "円）</span>";
          else vh += '<span class="ok">' + circled(base.i) + "にない　目安 " + yen(a) + "円まで</span>";
        } else {
          const next = vs.find((x) => !x.have);
          vh += '<span class="ng">' + circled(base.i) + "はもう持っている</span>";
          if (next) vh += '<span class="ok">' + circled(next.i) + "にはない</span>";
        }
        if (vs.length > 1) vh += '<span class="own">' + volStatusText(vs) + "</span>";
        if (baseC && baseC.kari) vh += '<span class="own kchip2">（仮の金額 ' + baseC.kari + "冊を含む）</span>";
      }
      h += vh + "</div>";
    }
    h += '<div class="facts">' +
      fact("販売価格", s.p != null ? yen(s.p) + "円" : "―") +
      fact("全巻数", (s.n != null ? s.n : s.vol.length) + "巻") +
      fact("平均仕入価格", s.avg != null ? yen(s.avg) + "円" : "―", s.avg < 0 ? "minus" : "") +
      fact("利益（Amazonで全部買ったら）", s.pr != null ? yen(s.pr) + "円" : "―", s.pr < 0 ? "minus" : "") +
      (estProfit ? fact(circled(aimCol) + "をそろえたら（過去の値段で）", yen(estProfit.v) + "円" + estProfit.p + (estProfit.noPast ? '<span class="k">（' + estProfit.noPast + "冊は目安で計算）</span>" : ""), estProfit.v < 0 ? "minus" : "") : "") +
      (amzProfit ? fact(circled(aimCol) + "をそろえたら（Amazonの最新で）", yen(amzProfit.v) + "円" + amzProfit.p + (amzProfit.noLatest ? '<span class="k">（' + amzProfit.noLatest + "冊は目安で計算）</span>" : ""), amzProfit.v < 0 ? "minus" : "") : "") +
      fact("販売スピード", s.rk != null ? yen(s.rk) : "―") +
      "</div>";
    h += '<div class="chips">' + chipsHtml(s) + "</div>";
    h += khHtml(s);
    h += "</section>";

    // 表
    h += '<div class="hbar" id="hbar" hidden><span>←</span><input id="hrange" type="range" min="0" max="1000" value="0" aria-label="表を横に動かす"><span>→</span><span class="hl" id="hlab"></span></div>';
    h += '<div class="tablebox" id="tbox"><table class="num"><thead><tr><th class="fx1">巻</th><th class="fx2" style="text-align:left">書名</th><th>最新</th><th>参考</th><th>目安' + (aimCol != null ? "<br>" + circled(aimCol) : "") + '</th>';
    cols.forEach((x) => { h += '<th class="own">' + circled(x.i) + "</th>"; });
    past.forEach((x, k) => { h += '<th' + (k === 0 ? ' class="own"' : "") + ">" + x.h + "</th>"; });
    h += "</tr></thead><tbody>";
    s.vol.forEach((v, i) => {
      const aim = aimOf(i);
      h += '<tr' + (i === vi ? ' class="hit" id="hitrow"' : "") + '><td class="vn">' + (i + 1) + '</td><td class="vt">' + esc(v[0] || "") + (khOf(s) && (khOf(s).kk || []).includes(i + 1) ? '<span class="kk">カカリ</span>' : "") + '<span class="j">' + esc(v[1] || "") + "</span>" + (function () { const a = auOf(s); return a && a.va && a.va[i] ? '<span class="va">' + esc(a.va[i]) + "</span>" : ""; })() + "</td>" +
        '<td class="g">' + yen(v[2]) + '</td><td class="ref">' + yen(v[3]) + '</td><td class="aim' + (aim != null && aim < 0 ? " minus" : "") + '">' + yen(aim) + "</td>";
      cols.forEach((x) => {
        const o = s.own[x.i];
        if (i >= x.n) { h += '<td class="own out">―</td>'; return; }   // この列は、この巻がなかったころのセット
        const val = o.x[i];
        const miss = val == null || val === "";
        const ent = miss ? entryAt(s, o, i + 1) : null;
        if (ent) {
          h += '<td class="own bought tap' + (ent.kari ? " kari" : "") + '" data-oi="' + x.i + '" data-v="' + (i + 1) + '">' + yen(ent.p) + (ent.dc > 0 ? '<span class="mark dc">-' + pctTxt(ent.dc) + "</span>" : "") + (ent.kari ? '<span class="mark k">仮</span>' : ent.done ? "" : '<span class="mark">未</span>') + "</td>";
        } else if (miss) {
          h += '<td class="own miss tap" data-oi="' + x.i + '" data-v="' + (i + 1) + '" aria-label="なし"></td>';
        } else {
          h += '<td class="own">' + esc(typeof val === "number" ? yen(val) : val) + "</td>";
        }
      });
      past.forEach((x, k) => { const pv = x.x[i]; h += '<td class="past"' + (k === 0 ? ' style="border-left:1px solid var(--line)"' : "") + ">" + (typeof pv === "number" ? yen(pv) : esc(pv == null ? "" : pv)) + "</td>"; });
      h += "</tr>";
    });
    h += "</tbody></table></div>";
    h += '<div class="legend"><span><b>最新</b>：グレーの列（Keepa）</span><span><b>参考</b>：参考価格の列</span><span><b>目安</b>：一番左のそろっていない列（見出しの丸数字）で、残りのお金（販売価格−手数料−利益1,000円−もう使ったお金）を、足りない巻に最新の値段の比で分けたもの。この値段までで買えば利益1,000円が残る（持っている巻・記入した巻は空欄）</span><span><b>①②…</b>：集めている列（なし＝まだ持っていない。押すと買った値段を記入できます。<span style=\"background:var(--bought);padding:0 4px\">緑</span>＝記入した巻、未＝まだExcelに入っていない、<span style=\"background:#fff1d6;color:#8a5a00;padding:0 4px\">仮</span>＝金額をあとで入れる本。仮の金額で計算している。<span style=\"color:var(--good)\">-20%</span>＝割引の日に買った本。値段は値札のまま、計算は割引後）</span><span><b>仕入・揃え済</b>：売れたセットと揃えたセットで買った値段（新しいほうから3つ）</span><span><b>1冊○円まで</b>：残りの巻をこの値段までで買えば、利益1,000円が残る（Excelの6行目と同じ。スマホで記入した巻も入れて計算。<span style=\"color:var(--bad)\">赤のマイナス</span>＝もう利益1,000円は取れない）</span><span><b style=\"color:var(--grey)\">1冊平均</b>：そろった列の、割引を引いた後の1冊の平均</span></div>';
    main.innerHTML = h;
    const back = $("back");
    if (back) back.addEventListener("click", () => showList(lastList.intro));
    setupHbar(keepScroll);
    main.querySelectorAll("td.own.tap").forEach((td) => td.addEventListener("click", () => openEditor(si, +td.dataset.oi, +td.dataset.v)));
    const hr = $("hitrow");
    if (keepScroll) window.scrollTo(0, scrollY);
    else if (hr && !$("verdict")) hr.scrollIntoView({ block: "center" }); else window.scrollTo(0, 0);
    if (!keepScroll) refocus();
  }

  // 横のスライドバーと表をつなぐ。今見えている一番左の列（①②…）を横に出す
  let hLeft = 0, hTop = 0;
  // 値段を入れる画面を開いたときの位置。保存・閉じたあとに同じ場所へもどす（キーボードの出し入れで飛ばないように）
  let edPos = null;
  function setupHbar(keep) {
    const box = $("tbox"), bar = $("hbar"), rg = $("hrange"), lab = $("hlab");
    if (!box || !bar) return;
    const heads = [...box.querySelectorAll("thead th")];
    const fixW = () => (heads[0] ? heads[0].offsetWidth : 0) + (heads[1] ? heads[1].offsetWidth : 0);
    const max = () => box.scrollWidth - box.clientWidth;
    const label = () => {
      const x = box.scrollLeft + fixW() + 4;
      const th = heads.slice(2).find((t) => t.offsetLeft + t.offsetWidth / 2 > x);
      lab.textContent = th ? th.innerText.replace(/\s+/g, " ") + " から" : "";
    };
    const sync = () => { const m = max(); rg.value = m > 0 ? Math.round((box.scrollLeft / m) * 1000) : 0; hLeft = box.scrollLeft; hTop = box.scrollTop; label(); };
    bar.hidden = max() <= 2;
    if (keep) { const L = edPos ? edPos.l : hLeft, T = edPos ? edPos.t : hTop; box.scrollLeft = L; box.scrollTop = T; hLeft = L; hTop = T; }
    else { hLeft = 0; hTop = 0; }
    rg.addEventListener("input", () => { box.scrollLeft = (rg.value / 1000) * max(); });
    box.addEventListener("scroll", sync, { passive: true });
    sync();
  }

  function showHome() {
    curView = { type: "home" };
    lastList = null;
    let h = "";
    if (DATA && DATA.sample) {
      h += '<div class="empty"><b>はじめに</b><div>セットデータの「スマホ用に書き出す」でできたファイル（セットデータ_スマホ用.json）を、上の「データを読み込む」から選んでください。このスマホの中に保存されるので、次からは電波がなくても探せます。</div><div class="note">今は見本のデータが入っています。試しに「十二国記」と入れるか、下のセットを押してみてください。</div></div>';
      lastList = { q: "見本", list: DATA.sets.map((_, i) => [i, -1]), byCode: false, intro: h };
      showList(h);
      return;
    }
    h += '<div class="empty"><b>バーコードを読むか、書名・セット名を入れてください</b><div class="note">読み取るとすぐ探します。ISBN（10けた）やASINでも探せます。</div></div>';
    h += histHtml();
    main.innerHTML = h;
    bindHist();
    refocus();
  }

  // ================= 見たセットの履歴（スマホとパソコンで共有） =================
  const hist = new Map();   // id → { id, s, gc, t, n（開いた回数）, at（最後に開いた日時） }
  try { (JSON.parse(localStorage.getItem("sc_hist") || "[]") || []).forEach((x) => { if (x && x.id) hist.set(x.id, x); }); } catch (e) {}
  const saveHistLocal = () => { try { localStorage.setItem("sc_hist", JSON.stringify([...hist.values()])); } catch (e) {} };
  const histId = (sh, gc) => { const k = sh + "|" + gc; let x = 5381; for (let i = 0; i < k.length; i++) x = ((x * 33) ^ k.charCodeAt(i)) >>> 0; return "h" + x.toString(36) + "_" + gc; };
  let histConfirm = false;
  function histPut(d) {
    if (!API) return;
    queueOp({ c: "history", op: "set", id: d.id, data: { s: d.s, gc: d.gc, t: d.t, n: d.n, at: d.at } });
  }
  function recordView(s) {
    if (!DATA || DATA.sample) return;
    const id = histId(s.s, s.col), old = hist.get(id);
    const d = { id, s: s.s, gc: s.col, t: s.t || "", n: (old && old.n ? old.n : 0) + 1, at: new Date().toISOString() };
    hist.set(id, d);
    saveHistLocal();
    histPut(d);
  }
  function delHist(id) {
    hist.delete(id);
    saveHistLocal();
    if (!API) return;
    queueOp({ c: "history", op: "delete", id });
  }
  const hDate = (iso) => { const d = new Date(iso); return isNaN(d) ? "" : (d.getMonth() + 1) + "/" + d.getDate() + " " + String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0"); };
  function histRows(list, withCount) {
    return list.map((x) => {
      const si = setIdx ? setIdx.get(x.s + "|" + x.gc) : undefined;
      return '<div class="hrow"><button class="go' + (si == null ? " gone" : "") + '" data-si="' + (si == null ? "" : si) + '"><span class="t">' + esc(x.t || "（セット名なし）") + '</span><span class="sub num">' +
        (withCount ? '<span class="hcnt">' + x.n + "回</span>　" : "") + esc(hDate(x.at)) + "　" + esc(x.s) + " " + esc(x.gc) + "列" + (si == null ? "　（今のデータにない）" : "") + "</span></button>" +
        '<button class="x" data-id="' + esc(x.id) + '" aria-label="履歴から消す">×</button></div>';
    }).join("");
  }
  function histHtml() {
    const all = [...hist.values()];
    if (!all.length) return "";
    const recent = all.slice().sort((a, b) => (a.at < b.at ? 1 : -1)).slice(0, 50);
    const often = all.slice().sort((a, b) => (b.n - a.n) || (a.at < b.at ? 1 : -1)).slice(0, 20);
    return '<section class="hist"><h2><span>最近見たセット</span></h2>' + histRows(recent, false) + "</section>" +
      '<section class="hist"><h2><span>よく見るセット</span></h2>' + histRows(often, true) + "</section>" +
      '<div class="actions"><button id="hClear">' + (histConfirm ? "本当に全部消す（" + all.length + "件）" : "履歴を全部消す") + "</button>" + (histConfirm ? '<button id="hNo">やめる</button>' : "") + "</div>";
  }
  function bindHist() {
    main.querySelectorAll(".hrow .go").forEach((b) => b.addEventListener("click", () => { if (b.dataset.si !== "") showSet(+b.dataset.si, -1, false); }));
    main.querySelectorAll(".hrow .x").forEach((b) => b.addEventListener("click", () => { delHist(b.dataset.id); showHome(); }));
    const hc = $("hClear");
    if (hc) hc.addEventListener("click", () => {
      if (!histConfirm) { histConfirm = true; showHome(); return; }
      histConfirm = false;
      [...hist.keys()].forEach(delHist);
      showHome();
    });
    const hn = $("hNo");
    if (hn) hn.addEventListener("click", () => { histConfirm = false; showHome(); });
  }


  // ================= 仕入れの記入 =================
  // 記入はGoogleの保存場所（Apps Script）に送る。電波がないときは、このスマホにためて、電波が入ったら送る
  let API = null, KEY = null;
  try {
    const hp = new URLSearchParams(location.hash.slice(1));
    if (hp.get("kk")) localStorage.setItem("sc_keepa", hp.get("kk"));   // 単品で使うKeepaのキー
    if (hp.get("u") && hp.get("k")) {
      localStorage.setItem("sc_api", JSON.stringify({ u: hp.get("u"), k: hp.get("k") }));
      history.replaceState(null, "", location.pathname + location.search);
    }
    const c = JSON.parse(localStorage.getItem("sc_api") || "null");
    if (c && c.u && c.k) { API = c.u; KEY = c.k; }
  } catch (e) {}
  let syncOk = null, syncAt = null;   // 最後に保存場所とやりとりできたか
  const server = new Map();          // id → 記入（保存場所にあるもの）
  let pending = [];                  // まだ保存場所に送れていない変更 [{c, op, id, data}]
  try { pending = JSON.parse(localStorage.getItem("sc_pending") || "[]") || []; } catch (e) { pending = []; }
  const savePending = () => { try { localStorage.setItem("sc_pending", JSON.stringify(pending)); } catch (e) {} };
  // 保存場所が使えなくても、この端末の中には残す
  const localOnly = new Map();
  try { (JSON.parse(localStorage.getItem("sc_local") || "[]") || []).forEach((e) => localOnly.set(e.id, e)); } catch (e) {}
  const saveLocal = () => { try { localStorage.setItem("sc_local", JSON.stringify([...localOnly.values()])); } catch (e) {} };

  function allEntries() {
    const m = new Map(server);
    localOnly.forEach((e, id) => { if (!m.has(id)) m.set(id, e); });
    pending.forEach((op) => { if ((op.c || "purchases") !== "purchases") return; if (op.op === "set") m.set(op.id, op.data); else m.delete(op.id); });
    return [...m.values()].filter((e) => e && e.id && !e.kind);
  }
  // 単品の仕入れ（セットの記入と同じ保存場所に、kind:"t" を付けて入れる）
  function allT() {
    const m = new Map(server);
    localOnly.forEach((e, id) => { if (!m.has(id)) m.set(id, e); });
    pending.forEach((op) => { if ((op.c || "purchases") !== "purchases") return; if (op.op === "set") m.set(op.id, op.data); else m.delete(op.id); });
    return [...m.values()].filter((e) => e && e.id && e.kind === "t");
  }
  // 単品のお気に入り（仕入れないけど、セールの日などにまた見たい本。kind:"f"）
  function allF() {
    const m = new Map(server);
    localOnly.forEach((e, id) => { if (!m.has(id)) m.set(id, e); });
    pending.forEach((op) => { if ((op.c || "purchases") !== "purchases") return; if (op.op === "set") m.set(op.id, op.data); else m.delete(op.id); });
    return [...m.values()].filter((e) => e && e.id && e.kind === "f");
  }
  const cellKey = (sh, gc, oc, v) => sh + "|" + gc + "|" + oc + "|" + v;
  // マスごとの記入（一番新しいもの）。記入が変わったら作り直す
  let entCache = null;
  function entryIndex() {
    if (entCache) return entCache;
    const m = new Map();
    allEntries().forEach((e) => { const k = cellKey(e.s, e.gc, e.oc, e.v); const b = m.get(k); if (!b || e.at > b.at) m.set(k, e); });
    entCache = m;
    return m;
  }
  function entryAt(s, o, v) {
    if (!o.c) return null;
    return entryIndex().get(cellKey(s.s, s.col, o.c, v)) || null;
  }
  const newId = () => "p" + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  const today = () => { const d = new Date(); return d.getFullYear() + "/" + String(d.getMonth() + 1).padStart(2, "0") + "/" + String(d.getDate()).padStart(2, "0"); };

  async function api(body) {
    const r = await fetch(API, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(Object.assign({ k: KEY }, body)), cache: "no-store", redirect: "follow" });
    if (!r.ok) throw new Error("http " + r.status);
    const j = await r.json();
    if (!j || j.ok !== true) throw new Error((j && j.error) || "ng");
    return j;
  }
  function queueOp(op) {
    // 同じものへの変更は最後の1つだけ送ればよい
    pending = pending.filter((p) => !((p.c || "purchases") === op.c && p.id === op.id));
    pending.push(op);
    savePending();
    flush();
  }
  let flushing = false;
  async function flush() {
    if (!API || !pending.length || flushing) return;
    flushing = true;
    const ops = pending.slice();
    try {
      await api({ a: "push", ops: ops.map((o) => ({ c: o.c || "purchases", op: o.op, id: o.id, data: o.data })) });
      pending = pending.filter((p) => !ops.includes(p));
      ops.forEach((o) => { if ((o.c || "purchases") === "purchases") { if (o.op === "set") server.set(o.id, o.data); else server.delete(o.id); } });
      savePending();
      entCache = null;
      syncOk = true; syncAt = new Date();
    } catch (e) {
      syncOk = false;   // 電波がないなど。あとで送り直す
    }
    flushing = false;
    updatePurchBtn();
    if (pending.length && syncOk) flush();
  }
  function change(op) {
    entCache = null;
    if (op.op === "set") localOnly.set(op.id, op.data); else localOnly.delete(op.id);
    saveLocal();
    if (API) queueOp(Object.assign({ c: "purchases" }, op));   // 先に送る順番に入れる（消したものが画面に残らないように）
    updatePurchBtn();
    rerender();
  }
  function rerender() {
    if (curView.type === "set") showSet(curView.si, curView.vi, curView.fromScan, true);
    else if (curView.type === "purch") showPurch(true);
    else if (curView.type === "list" && lastList) { const y = window.scrollY; showList(curView.intro); window.scrollTo(0, y); }
    else if (curView.type === "home" && DATA && !DATA.sample) showHome();
    else if (curView.type === "tan") showTan();
    else if (curView.type === "tpur") showTPur(true);
    else if (curView.type === "tsrch") showTSrch();
    else if (curView.type === "tdet") showTDet(curView.id);
    else if (curView.type === "tfav") showTFav();
  }
  function updatePurchBtn() {
    const all = allEntries().filter((e) => !e.done);
    let tn = 0; try { tn = allT().filter((e) => !e.done).length; } catch (e) {}
    const n = all.length + tn, k = all.filter((e) => e.kari).length;
    $("purchBtn").innerHTML = "仕入れ一覧" + (n ? "（未反映 <b>" + n + "</b>" + (k ? "・仮 <b>" + k + "</b>" : "") + "）" : "");
    try { updateTanBtn(); } catch (e) {}
  }

  // ---------- 値段を入れる画面 ----------
  const sheet = $("sheet");
  // よく買う値段：132円・242円はいつも出し、ほかは記入した回数の多い順（この端末に残す）
  let priceCnt = {};
  try { priceCnt = JSON.parse(localStorage.getItem("sc_prices") || "{}") || {}; } catch (e) { priceCnt = {}; }
  const notePrice = (p) => { priceCnt[p] = (priceCnt[p] || 0) + 1; try { localStorage.setItem("sc_prices", JSON.stringify(priceCnt)); } catch (e) {} };
  // 仮の金額：店で値段を入れずに登録するときの金額。安めにすると「いくらまで」が甘くなるので、高めにしておく
  let kariP = 330;
  try { const k = parseInt(localStorage.getItem("sc_kariP") || "", 10); if (k > 0) kariP = k; } catch (e) {}

  // ---------- 仕入れ一覧 ----------

      '<div class="note">' + (!API ? '<span style="color:var(--bad)">保存場所が設定されていません。最初に送ったリンクから開き直してください（記入はこのスマホの中には残ります）。</span>' : syncOk === false ? "保存場所につながっていません（電波が入ると送ります）" : syncAt ? "保存場所と " + String(syncAt.getHours()).padStart(2, "0") + ":" + String(syncAt.getMinutes()).padStart(2, "0") + " にやりとりしました" : "保存場所につないでいます…") + "</div>" +
      '<div class="note">パソコンでこのページを開いて「Excel用に保存」を押すと、セット本は「スマホ仕入れ_….csv」（セットデータの「スマホの仕入れを書き込む」で書き込む）、単品は「StockList_….csv」（00仕入れリストの仕入予定シートの取り込みボタンで入る）がダウンロードフォルダに入ります。</div>' +
      '<div class="actions"><button id="pSave" class="btn-primary"' + (todo.length || ttodo.length ? "" : " disabled") + ">Excel用に保存（セット " + todo.length + "冊・単品 " + ttodo.length + "冊）</button></div>" +
      (waitIds.length || tWait.length ? '<div>Excelに取り込めたら押してください：<div class="actions" style="margin-top:6px"><button id="pDone">保存した ' + (waitIds.length + tWait.length) + "冊を反映済みにする</button></div></div>" : "") +

    // 日付ごと

          '<div class="pv num">' + circled(e.oi || 0) + "の列（" + esc(e.oc) + "列）　" + e.v + "巻" + (e.vt ? "　" + esc(e.vt) : "") + "</div></div>";

  // Excel用のファイル（CSV）
  const csvq = (v) => { const t = String(v == null ? "" : v); return /[",\r\n]/.test(t) ? '"' + t.replace(/"/g, '""') + '"' : t; };
  function exportCsv(todo, quiet) {
    const msg = $("pMsg");
    // 値段は値札の値段。割引の日は「店」を「店舗 20%」のようにして、セットデータで割引の色に塗る
    const rows = [["日付", "シート", "セット名", "セットのASIN", "グレーの列", "書き込む列", "巻", "書名", "JAN", "値段", "店", "ID"]];
    todo.slice().sort((a, b) => (a.at < b.at ? -1 : 1)).forEach((e) => rows.push([e.d, e.s, e.t, e.a, e.gc, e.oc, e.v, e.vt, e.j, e.p, e.dc > 0 ? "店舗 " + pctTxt(e.dc) : "店舗", e.id]));
    const csv = "﻿" + rows.map((r) => r.map(csvq).join(",")).join("\r\n") + "\r\n";
    const d = new Date();
    const fn = "スマホ仕入れ_" + d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0") + "_" + String(d.getHours()).padStart(2, "0") + String(d.getMinutes()).padStart(2, "0") + ".csv";
    try {
      const url = URL.createObjectURL(new Blob([csv], { type: "text/csv;charset=utf-8" }));
      const a = document.createElement("a");
      a.href = url; a.download = fn; document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 5000);
      lastExport = todo.map((e) => e.id);
      try { localStorage.setItem("sc_lastExport", JSON.stringify(lastExport)); } catch (e) {}
      if (quiet) return fn;
      showPurch(true);
      const m2 = $("pMsg"); m2.hidden = false; m2.textContent = fn + " をダウンロードフォルダに保存しました。";
    } catch (e) {
      if (quiet) return null;
      msg.hidden = false;
      msg.textContent = e && e.code === "declined" ? "保存をやめました。" : "保存できませんでした。もう一度押してください。";
    }
  }

  $("purchBtn").addEventListener("click", () => { closeEditor(); showPurch(false); });
  let histFirst = true;
  async function pull() {
    if (!API) return;
    await flush();
    if (pending.length) return;   // 送れていないうちは取りにいかない（古いもので上書きしないため）
    try {
      const j = await api({ a: "pull" });
      syncOk = true; syncAt = new Date();
      // 見たセットの履歴：最初はこの端末だけにある分を送り、あとは保存場所のものに合わせる
      const srv = new Map();
      (j.history || []).forEach((x) => { if (x && x.id) srv.set(x.id, x); });
      if (histFirst) {
        histFirst = false;
        hist.forEach((x, id) => {
          const sv = srv.get(id);
          if (!sv || (x.at > sv.at && x.n >= sv.n)) { histPut(x); srv.set(id, x); }
        });
      }
      hist.clear();
      srv.forEach((x, id) => hist.set(id, x));
      saveHistLocal();
      server.clear();
      (j.purchases || []).forEach((x) => { if (x && x.id) server.set(x.id, x); });
      // 保存場所に入ったものは、この端末だけの控えから外す
      server.forEach((_, id) => { if (!pending.some((op) => op.id === id)) localOnly.delete(id); });
      localOnly.forEach((_, id) => { if (!pending.some((op) => op.id === id) && !server.has(id)) localOnly.delete(id); });
      saveLocal();
      entCache = null;
      updatePurchBtn();
      if (sheet.hidden) {
        if (curView.type === "home" && DATA && !DATA.sample) showHome(); else rerender();
      }
    } catch (e) {
      syncOk = false;
      updatePurchBtn();
    }
  }
  window.addEventListener("online", pull);
  document.addEventListener("visibilitychange", () => { if (!document.hidden) pull(); });
  setInterval(() => { if (!document.hidden) pull(); }, 60000);
  if (API) {
    // この端末だけにあった記入を送る
    localOnly.forEach((e, id) => { if (!pending.some((op) => op.id === id)) pending.push({ c: "purchases", op: "set", id, data: e }); });
    savePending();
    migrate().then(pull);
  }
  // 前の保存場所（Claudeのページ）にあった記入と履歴を、1回だけ移す（保存場所にまだないものだけ入る）
  async function migrate() {
    try {
      if (localStorage.getItem("sc_migrated") === "1") return;
      const m = await loadEnc("data/migrate.enc");
      if (!m) return;
      const ops = [];
      ["purchases", "history"].forEach((c) => Object.keys(m[c] || {}).forEach((id) => ops.push({ c, op: "add", id, data: m[c][id] })));
      if (ops.length) await api({ a: "push", ops });
      localStorage.setItem("sc_migrated", "1");
    } catch (e) {}
  }

  // 次のバーコードがそのまま入るように、検索の欄を選んだ状態にしておく
  function refocus() {
    if (sheet && !sheet.hidden) return;

  // ---------- 出版社・作者：ページと一緒に置いた author.json を読む（キーはセットのASIN、なければ "J"+1巻のJAN） ----------
  // 公開の置き場所には暗号化して置いてある。合言葉（KEY）で戻す
  async function loadEnc(path) {
    if (!KEY || !window.crypto || !crypto.subtle) return null;
    const r = await fetch(path, { cache: "no-cache" });
    if (!r.ok) return null;
    const o = await r.json();
    const b = (t) => Uint8Array.from(atob(t), (ch) => ch.charCodeAt(0));
    const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(KEY), "PBKDF2", false, ["deriveKey"]);
    const key = await crypto.subtle.deriveKey({ name: "PBKDF2", salt: b(o.s), iterations: 200000, hash: "SHA-256" }, base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
    const gz = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b(o.i) }, key, b(o.d));
    const txt = await new Response(new Blob([gz]).stream().pipeThrough(new DecompressionStream("gzip"))).text();
    return JSON.parse(txt.replace(/^\ufeff/, ""));
  }
  let AU = null;

  }

  }

  // ---------- セットの小部屋（ソルーさんの投稿）：ページと一緒に置いた koheya.json を読む ----------
  let KH = null;
  async function loadKoheya() {

  };
  const khGradeCls = (g) => (g === "◎" || g === "○" ? "g1" : g === "×" ? "g3" : "");

      (k.cnt ? '<span class="num">投稿 ' + k.cnt + "回（◎○ " + (k.good || 0) + "・× " + (k.bad || 0) + "）　最終 " + esc(k.last || "") + "</span>" : "") + "</div>";

  // Keepaのグラフ画像（ランキング・新品・中古・Amazon、過去1年）
  const kGraph = (asin, w, h) => "https://api.keepa.com/graphimage?key=" + encodeURIComponent(KK) + "&domain=5&asin=" + asin + "&salesrank=1&new=1&used=1&amazon=1&range=365&width=" + w + "&height=" + h;

  // ---------- Keepa ----------
  const kTime = (t) => (t + 21564000) * 60000;
  const pos = (v) => (typeof v === "number" && v > 0 ? v : null);
  function minOf(cur, idx) {
    let best = null, bi = -1;

    return { v: best, i: bi };
  }
  const USED_LBL = { 19: "ほぼ新品", 20: "非常に良い", 21: "良い", 2: "中古" };
  const NEW_LBL = { 0: "Amazon", 7: "新品", 10: "新品(FBA)" };
  function imgOf(p) {
    if (Array.isArray(p.images) && p.images[0]) { const im = p.images[0]; const n = im.m || im.l || im.s; if (n) return "https://m.media-amazon.com/images/I/" + n; }

  // ランキングの過去365日（1日1点に間引く）
  function rankHist(p) {
    const a = (p.csv && p.csv[3]) || [];
    const from = Date.now() - 365 * 86400000, out = [];
    let lastDay = -1, prev = null;
    for (let i = 0; i + 1 < a.length; i += 2) {
      const t = kTime(a[i]), v = a[i + 1];
      if (t < from) { prev = v; continue; }
      if (prev != null && !out.length && prev > 0) out.push([Math.round(from / 3600000), prev]);

        else out.push([h, v]);

      }
    }
    return out;
  }
  function fromKeepa(p, code) {
    const st = p.stats || {}, cur = st.current || [];

  // ---------- 計算（アマサーチと同じ：目標額＝利益率と最低利益額の両方を満たす仕入れ額） ----------
  function feeOf(r, price) { return Math.ceil((price * (r.ref || 15)) / 100) + 140 + (TSET.fba && r.ppf ? r.ppf : 0); }
  function profitOf(r, price) { return price ? price - feeOf(r, price) : null; }
  function targetOf(r, price) { const pr = profitOf(r, price); return pr == null ? null : pr - Math.max(Math.ceil((price * TSET.rate) / 100), TSET.min); }

  const ynum = (v) => (v == null ? "-" : yen(v));
  const rcls = (v) => (v != null && v < 0 ? " minus" : "");

  // ランキングのグラフ（小さく）
  function graphSvg(g, w, h) {
    if (!g || g.length < 2) return '<div class="tg empty">グラフなし</div>';
    const t0 = g[0][0], t1 = Math.max(g[g.length - 1][0], Math.round(Date.now() / 3600000));
    let lo = Infinity, hi = 0;
    g.forEach((x) => { if (x[1] < lo) lo = x[1]; if (x[1] > hi) hi = x[1]; });
    if (hi === lo) hi = lo + 1;
    const X = (t) => ((t - t0) / Math.max(1, t1 - t0)) * (w - 2) + 1, Y = (v) => h - 12 - ((v - lo) / (hi - lo)) * (h - 16) + 2;
    let d = "M" + X(g[0][0]).toFixed(1) + " " + Y(g[0][1]).toFixed(1);
    for (let i = 1; i < g.length; i++) d += "H" + X(g[i][0]).toFixed(1) + "V" + Y(g[i][1]).toFixed(1);

  }

  function bindTanRows() {

    main.querySelectorAll(".trow").forEach((row) => {
      // スワイプ：指でもマウスでも動く（pointerイベント）。横に90px以上動かしたら、右＝仕入れ／左＝消す
      let sx = 0, sy = 0, moved = false, pid = null, horiz = false;
      const reset = () => { row.style.transition = ""; row.style.transform = ""; row.classList.remove("swR", "swL"); pid = null; horiz = false; };
      row.addEventListener("pointerdown", (e) => { if (e.button > 0) return; pid = e.pointerId; sx = e.clientX; sy = e.clientY; moved = false; horiz = false; row.style.transition = "none"; });
      row.addEventListener("pointermove", (e) => {
        if (pid !== e.pointerId) return;
        const dx = e.clientX - sx, dy = e.clientY - sy;
        if (!horiz && Math.abs(dx) > 12 && Math.abs(dx) > Math.abs(dy) * 1.3) { horiz = true; moved = true; try { row.setPointerCapture(pid); } catch (x) {} }
        if (horiz) { row.style.transform = "translateX(" + dx + "px)"; row.classList.toggle("swR", dx > 90); row.classList.toggle("swL", dx < -90); }
      });
      row.addEventListener("pointerup", (e) => {
        if (pid !== e.pointerId) return;
        const dx = e.clientX - sx, was = horiz;
        reset();

        const r = TLIST.find((x) => x.id === row.dataset.id) || (curView.type === "tfav" ? (allF().find((x) => favId(x.a) === row.dataset.id) || {}).snap : null);

      });
    });

  // ---------- バーコードを読んだら ----------
  function tCode(raw) {
    const s = String(raw || "").normalize("NFKC").replace(/[\s-]/g, "").toUpperCase();
    if (/^(97[89]\d{10}|4[59]\d{11})$/.test(s)) return { p: "code=" + s, code: s };
    if (/^\d{9}[\dX]$/.test(s)) return { p: "asin=" + s, code: s };
    if (/^B0[0-9A-Z]{8}$/.test(s)) return { p: "asin=" + s, code: s };
    if (/^\d{8}$|^\d{12,13}$/.test(s)) return { p: "code=" + s, code: s };
    return null;
  }
  async function tLookup(raw) {
    const c = tCode(raw);
    const r0 = { id: "w" + Date.now().toString(36), code: String(raw).trim(), at: new Date().toISOString(), wait: true };
    if (!c) {
      const term = String(raw || "").trim();
      if (term.length >= 2 && !/^\d+$/.test(term.normalize("NFKC"))) return tWordSearch(term);   // 書名で探す
      r0.wait = false; r0.err = "本のバーコード（JAN・ISBN）ではないようです"; TLIST.unshift(r0); saveTlist(); if (curView.type === "tan") showTan(); return;
    }
    if (!KK) { showTSet(); return; }
    TLIST.unshift(r0);
    if (curView.type !== "tan") showTan(); else showTan();
    tBusy++;
    let r;
    try {
      const j = await keepa(c.p + "&stats=365&history=1&days=365");
      const p = j.products && j.products.find((x) => x && x.asin && x.title);
      if (!p) throw new Error("Amazonに商品が見つかりませんでした");
      r = fromKeepa(p, c.code);
    } catch (e) {
      r = { id: r0.id, code: c.code, at: r0.at, err: (e && e.message) || "調べられませんでした", net: !navigator.onLine };
      if (e instanceof TypeError) r.err = navigator.onLine ? "Keepaにつながりませんでした" : "電波がないため調べられませんでした";
    }
    tBusy--;
    const i = TLIST.findIndex((x) => x.id === r0.id);
    if (i >= 0) TLIST[i] = r; else TLIST.unshift(r);
    if (!r.err) { const f = allF().find((x) => x.a === r.asin); if (f) change({ op: "set", id: f.id, data: Object.assign({}, f, { snap: Object.assign({}, r), t: r.t }) }); }   // お気に入りの中身も今の値段に
    saveTlist();
    if (curView.type === "tan") showTan();
    if (!r.err) tSignal(r);
  }

      u.lang = "ja-JP"; u.rate = 1.5; u.volume = 1;
      speechSynthesis.cancel(); speechSynthesis.speak(u);
    } catch (e) {}
  }

      const e = allT().find((x) => x.id === row.dataset.id);
      if (!e || e.done) return;
      openTBuy({ asin: e.a, jan: e.j, t: e.t, usedP: e.sp, newP: e.sp, ref: e.ref, ppf: e.ppf, list: e.list }, e);
    }));
  }
  // Shift_JIS にする（00仕入れリストのマクロは Shift_JIS で読む）。ブラウザの読み取り表から逆引きの表を作る
  let SJ = null;
  function sjisTable() {
    if (SJ) return SJ;
    SJ = new Map();
    const dec = new TextDecoder("shift_jis");
    for (let b = 0xa1; b <= 0xdf; b++) SJ.set(dec.decode(new Uint8Array([b])), [b]);
    for (let a = 0x81; a <= 0xfc; a++) {
      if (a > 0x9f && a < 0xe0) continue;
      for (let b = 0x40; b <= 0xfc; b++) {
        if (b === 0x7f) continue;
        const ch = dec.decode(new Uint8Array([a, b]));
        if (ch.length === 1 && ch !== "�" && !SJ.has(ch)) SJ.set(ch, [a, b]);
      }
    }
    return SJ;
  }
  function toSjis(str) {
    const t = sjisTable(), out = [];
    for (const ch of str) {
      const c = ch.codePointAt(0);
      if (c < 0x80) { out.push(c); continue; }
      const m = t.get(ch) || t.get(ch.normalize("NFKC")) || [0x3f];
      m.forEach((b) => out.push(b));
    }
    return new Uint8Array(out);
  }
  function tExportCsv(todo, quiet) {
    const pad = (n) => String(n).padStart(2, "0");
    const head = ["ASIN", "JAN", "商品名", "販売予定価格", "仕入れ価格", "見込み利益", "参考価格", "損益分岐点", "仕入れ個数", "コンディション", "発送方法", "SKU", "仕入れ先", "コメント", "仕入れ日", "その他費用", "コンディション説明"];
    const rows = [head];
    todo.slice().sort((a, b) => (a.at < b.at ? -1 : 1)).forEach((e) => {
      const d = new Date(e.at);
      const dt = d.getFullYear() + "/" + pad(d.getMonth() + 1) + "/" + pad(d.getDate()) + " " + pad(d.getHours()) + ":" + pad(d.getMinutes()) + ":" + pad(d.getSeconds());
      const shop = (e.shop || "店舗") + (e.dc > 0 ? " " + Math.round(e.dc * 100) + "%" : "");
      const cost = e.dc > 0 ? Math.floor(e.p * (1 - e.dc)) : e.p;
      rows.push([e.a, e.j, e.t, e.sp || "", e.p, e.pf != null ? e.pf - cost : "", e.list || "", "", 1, e.cond, e.ship, "", shop, e.com || "", dt, "", ""]);
    });
    const csv = rows.map((r) => r.map(csvq).join(",")).join("\r\n") + "\r\n";
    const d = new Date();
    const fn = "StockList_" + d.getFullYear() + pad(d.getMonth() + 1) + pad(d.getDate()) + "_" + pad(d.getHours()) + pad(d.getMinutes()) + "_standard.csv";
    try {
      const url = URL.createObjectURL(new Blob([toSjis(csv)], { type: "text/csv;charset=shift_jis" }));
      const a = document.createElement("a");
      a.href = url; a.download = fn; document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 5000);
      tLastExport = todo.map((e) => e.id);
      try { localStorage.setItem("sc_tlastExport", JSON.stringify(tLastExport)); } catch (e) {}
      return fn;
    } catch (e) { return null; }
  }

  // ---------- 設定 ----------
  function showTSet() {
    curView = { type: "tan" };
    sheet.innerHTML =
      '<div class="st">単品の設定</div>' +
      '<div class="row"><span class="note">KeepaのAPIアクセスキー</span><input id="tsKey" class="small wide" type="text" autocomplete="off" value="' + esc(KK) + '" placeholder="アマサーチのKeepa設定と同じキーを貼る"></div>' +
      '<div class="row"><span class="note">目標利益率</span><input id="tsRate" class="small" type="text" inputmode="numeric" value="' + TSET.rate + '"><span class="note">%　最低利益額</span><input id="tsMin" class="small" type="text" inputmode="numeric" value="' + TSET.min + '"><span class="note">円</span></div>' +
      '<div class="row"><label><input id="tsFba" type="checkbox"' + (TSET.fba ? " checked" : "") + "> FBAを使う（手数料にFBAの料金を足す）</label></div>" +
      '<div class="row"><label><input id="tsVoice" type="checkbox"' + (TSET.voice ? " checked" : "") + "> 中古の粗利益を読み上げる</label></div>" +
      '<div class="row"><label><input id="tsAlert" type="checkbox"' + (TSET.alert ? " checked" : "") + "> プレ値（定価以上・粗利500円以上・中古良い以上）を赤くして震わせる</label></div>" +
      '<div class="row"><button id="tsSave" class="btn-primary" type="button">保存</button><button id="edClose" type="button">閉じる</button></div>';
    sheet.hidden = false;
    $("edClose").addEventListener("click", closeEditor);
    $("tsSave").addEventListener("click", () => {
      KK = String($("tsKey").value || "").trim();
      try { localStorage.setItem("sc_keepa", KK); } catch (e) {}
      const n = (id, d) => { const v = parseInt(String($(id).value).normalize("NFKC").replace(/[^0-9]/g, ""), 10); return v >= 0 ? v : d; };
      TSET.rate = n("tsRate", 30); TSET.min = n("tsMin", 500);
      TSET.fba = $("tsFba").checked; TSET.voice = $("tsVoice").checked; TSET.alert = $("tsAlert").checked;
      saveTset();
      closeEditor();
      showTan();
    });
  }


  // ---------- ワード検索（書名で探す。Keepaの検索は1回で10トークンほど） ----------
  let tSrch = null;
  async function tWordSearch(term) {
    if (!KK) { showTSet(); return; }
    tSrch = { term, list: null, err: "" };
    showTSrch();
    try {
      const j = await keepa("type=product&term=" + encodeURIComponent(term) + "&stats=365&history=1&days=365", "search");
      tSrch.list = (j.products || []).filter((p) => p && p.asin && p.title).map((p) => { const r = fromKeepa(p, p.asin); r.noStats = !p.stats; return r; });
    } catch (e) { tSrch.err = (e && e.message) || "探せませんでした"; tSrch.list = []; if (e instanceof TypeError) tSrch.err = navigator.onLine ? "Keepaにつながりませんでした" : "電波がないため探せませんでした"; }
    if (curView.type === "tsrch") showTSrch();
  }
  function showTSrch() {
    curView = { type: "tsrch" };
    if (!tSrch) return showTan();
    let h = '<div class="status">「' + esc(tSrch.term) + "」の検索" + (tSrch.list ? "：" + tSrch.list.length + "件" : "") + (tokensLeft != null ? '　<span class="note">Keepa残り ' + tokensLeft + "トークン</span>" : "") + "</div>";
    if (!tSrch.list) h += '<div class="note">Keepaで探しています…（10トークンほど）</div>';
    else if (tSrch.err) h += '<div class="empty">' + esc(tSrch.err) + "</div>";
    else if (!tSrch.list.length) h += '<div class="empty">見つかりませんでした。言葉を変えてみてください。</div>';
    else h += '<div class="note">押した本が、読んだ本の一覧の一番上に入ります。</div><div class="tlist">' + tSrch.list.map((r) => tRowHtml(Object.assign({}, r, { id: "s" + r.asin }))).join("") + "</div>";
    main.innerHTML = h;
    main.querySelectorAll(".trow").forEach((row) => row.addEventListener("click", () => {
      const r = tSrch.list.find((x) => "s" + x.asin === row.dataset.id);
      if (!r) return;
      if (r.noStats) { tLookup(r.asin); return; }   // 値段が付いてこなかったときは、ASINで調べ直す（1トークン）
      TLIST = TLIST.filter((x) => x.asin !== r.asin || x.at !== r.at);
      TLIST.unshift(Object.assign({}, r, { id: "t" + Date.now().toString(36), at: new Date().toISOString() }));
      saveTlist();
      showTan();
      tSignal(TLIST[0]);
    }));
    updateTanBtn();
    refocus();
  }

  // ---------- カメラで読む（Androidのchromeのバーコード読み取りを使う） ----------
  let camStream = null, camTimer = null, camDet = null, camLast = { c: "", t: 0 };
  const camMsg = (t) => { $("camMsg").textContent = t; };
  async function camOpen() {
    $("cam").hidden = false;
    if (camStream) return;
    if (!("BarcodeDetector" in window)) { camMsg("このブラウザではカメラで読めません（AndroidのChromeなら読めます）"); return; }
    try {
      const fm = await BarcodeDetector.getSupportedFormats();
      camDet = new BarcodeDetector({ formats: ["ean_13", "ean_8", "upc_a", "upc_e", "code_128", "code_39", "codabar", "itf"].filter((f) => fm.includes(f)) });
      camStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment", width: { ideal: 1280 }, height: { ideal: 720 } }, audio: false });
      const v = $("camV"); v.srcObject = camStream; await v.play();
      camMsg("バーコードを写してください");
      camLoop();
    } catch (e) { camMsg("カメラを開けませんでした（Chromeのカメラの許可を確かめてください）"); camStop(true); }
  }
  async function camLoop() {
    if (!camStream) return;
    try {
      const r = await camDet.detect($("camV"));
      for (const b of r) { const c = String(b.rawValue || "").trim(); if (c) { camHit(c); break; } }
    } catch (e) {}
    camTimer = setTimeout(camLoop, 150);
  }
  function camHit(c) {
    const now = Date.now();
    if (c === camLast.c && now - camLast.t < 3000) { camLast.t = now; return; }   // 同じバーコードを写したままのときは1回だけ
    camLast = { c, t: now };
    const isBook = /^(97[89]\d{10}|4[59]\d{11})$/.test(c) || /^\d{9}[\dX]$/.test(c);
    if (!isBook) { camMsg("読んだ：" + c + "（本のバーコードではありません）"); return; }
    try { navigator.vibrate && navigator.vibrate(60); } catch (e) {}
    camMsg("読んだ：" + c);
    closeEditor();
    q.value = c;
    $("f").requestSubmit();
  }
  function camStop(keepPanel) {
    clearTimeout(camTimer);
    if (camStream) { camStream.getTracks().forEach((t) => t.stop()); camStream = null; }
    const v = $("camV"); if (v) v.srcObject = null;
    if (!keepPanel) $("cam").hidden = true;
  }
  $("camBtn").addEventListener("click", () => { if (camStream) camStop(); else camOpen(); });
  $("camClose").addEventListener("click", () => camStop());
  document.addEventListener("visibilitychange", () => { if (document.hidden && camStream) camStop(); });
  $("tanBtn").addEventListener("click", () => { closeEditor(); edPos = null; q.value = ""; if (isTView()) { showHome(); } else showTan(); window.scrollTo(0, 0); updateTanBtn(); });

  // ================= ブラウザのように「戻る」 =================
  // 画面が変わるたびに履歴に積む。「← 戻る」ボタンとAndroidの戻る操作で1つずつさかのぼる
  const navStates = [];
  let navPos = 0, navQuiet = false;
  const navKey = (v, ll) => v.type + "|" + (v.type === "list" ? (ll ? ll.q : "") : v.type === "set" ? v.si : v.type === "tdet" ? v.id : v.type === "tsrch" ? (tSrch ? tSrch.term : "") : "");
  function navBtn() { $("backBtn").setAttribute("aria-disabled", navPos > 0 ? "false" : "true"); }
  function navRecord() {
    const st = { v: Object.assign({}, curView), ll: lastList, y: 0 };
    const cur = navStates[navPos];
    if (navQuiet || !cur || navKey(cur.v, cur.ll) === navKey(st.v, st.ll)) {
      if (cur) st.y = cur.y;
      navStates[navPos] = st;
      try { history.replaceState({ n: navPos }, ""); } catch (e) {}
    } else {
      navPos++;
      navStates.length = navPos;
      navStates.push(st);
      try { history.pushState({ n: navPos }, ""); } catch (e) {}
    }
    navBtn();
  }
  window.addEventListener("scroll", () => { const st = navStates[navPos]; if (st) st.y = window.scrollY; }, { passive: true });
  const _home = showHome, _list = showList, _set = showSet, _purch = showPurch, _rerender = rerender;
  showHome = function () { const r = _home.apply(this, arguments); navRecord(); try { updateTanBtn(); } catch (e) {} return r; };
  showList = function () { const r = _list.apply(this, arguments); navRecord(); return r; };
  showSet = function () { const r = _set.apply(this, arguments); navRecord(); return r; };
  showPurch = function () { const r = _purch.apply(this, arguments); navRecord(); return r; };
  const _tan = showTan, _tdet = showTDet, _tpur = showTPur, _tsrch = showTSrch, _tfav = showTFav;
  showTFav = function () { const r = _tfav.apply(this, arguments); navRecord(); return r; };
  showTSrch = function () { const r = _tsrch.apply(this, arguments); navRecord(); return r; };
  showTan = function () { const r = _tan.apply(this, arguments); navRecord(); return r; };
  showTDet = function () { const r = _tdet.apply(this, arguments); navRecord(); return r; };
  showTPur = function () { const r = _tpur.apply(this, arguments); navRecord(); return r; };
  rerender = function () { const was = navQuiet; navQuiet = true; try { return _rerender.apply(this, arguments); } finally { navQuiet = was; } };
  window.addEventListener("popstate", (e) => {
    // 値段を入れる画面が開いていたら、まずそれを閉じる
    if (!sheet.hidden) { closeEditor(); try { history.pushState({ n: navPos }, ""); } catch (x) {} return; }
    const n = e.state && typeof e.state.n === "number" ? e.state.n : 0;
    const st = navStates[n];
    navPos = st ? n : 0;
    navQuiet = true;
    try {
      if (!st) { showHome(); return; }
      lastList = st.ll;
      const v = st.v;
      if (v.type === "list" && lastList) showList(v.intro);
      else if (v.type === "set") showSet(v.si, v.vi, v.fromScan, false);
      else if (v.type === "purch") showPurch(false);
      else if (v.type === "tan") showTan();
      else if (v.type === "tdet") showTDet(v.id);
      else if (v.type === "tpur") showTPur(false);
      else if (v.type === "tsrch") showTSrch();
      else if (v.type === "tfav") showTFav();
      else showHome();
      const y = st.y || 0;
      setTimeout(() => window.scrollTo(0, y), 0);
    } finally { navQuiet = false; navBtn(); }
  });
  $("backBtn").addEventListener("click", () => { if (!sheet.hidden) { closeEditor(); return; } if (navPos > 0) history.back(); });

  // 起動：このスマホに保存したデータ → なければ見本
  updatePurchBtn();
  loadKoheya();
  loadAuthor();
  useData(SAMPLE);
  showHome();
  if ("serviceWorker" in navigator) { try { navigator.serviceWorker.register("sw.js"); } catch (e) {} }
  loadData().then((obj) => {
    if (obj && Array.isArray(obj.sets)) { useData(obj); showHome(); }
  });
})();
</script>
